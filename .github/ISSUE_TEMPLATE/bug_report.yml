name: Bug report
description: Something isn't working the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you click, press, or run before it broke?
      placeholder: |
        1. Opened the Library page
        2. Pressed ...
  - type: input
    id: version
    attributes:
      label: TuneTUI version
      description: From the release filename, `tune --version`, or the commit hash if built from source.
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows
        - Linux
        - macOS
        - Other (specify below)
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste any terminal output or attach a screenshot.
